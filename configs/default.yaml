device:
  name: cuda
  dtype: bfloat16

models:
  segmentation:
    backend: sam2
    model_id: facebook/sam2.1-hiera-base-plus
    checkpoint: null
    multimask_output: true
  flux_fill:
    backend: flux_fill
    model_id: black-forest-labs/FLUX.1-Fill-dev
    checkpoint: null
    cpu_offload: true
    quantization: null
    quantization_components: [transformer]
    num_inference_steps: 28
  # One compact distilled pipeline handles direct editing and text-to-image.
  flux2_klein:
    backend: flux2_klein
    model_id: black-forest-labs/FLUX.2-klein-4B
    checkpoint: null
    cpu_offload: true
    quantization: null
    num_inference_steps: 4
    guidance_scale: 1.0
    size_multiple: 16
    vae_tiling: true
    vae_slicing: true
  omnipaint:
    backend: omnipaint
    model_id: yeates/OmniPaint
    checkpoint: null
    base_model_id: black-forest-labs/FLUX.1-dev
    source_path: ../third_party/OmniPaint
    # OmniPaint bypasses Diffusers' transformer forward hook. Keep its INT8
    # transformer resident on the GPU so bitsandbytes retains CB/SCB state.
    cpu_offload: false
    # Upstream allows 1024px, but this project uses a safer 768px profile for
    # 32 GB GPUs. Raise to 1024 only after measuring peak VRAM on your device.
    max_image_side: 768
    reference_size: 512
    reference_position_delta: [0, -32]
    removal_lora: weights/omnipaint_remove.safetensors
    insertion_lora: weights/omnipaint_insert.safetensors
    removal_embedding: embeddings/remove.npz
    insertion_embedding: embeddings/insert.npz
    # Quantize only OmniPaint's largest component. Activations and the VAE stay
    # bfloat16; this is separate from dtype and is the intended 32 GB profile.
    quantization: bitsandbytes_8bit
    quantization_components: [transformer]
    load_text_encoders: false
    vae_tiling: true
    vae_slicing: true
    # The sequential ModelManager releases this backend when another one loads.
    release_cuda_after_run: false
    num_inference_steps: 28
    guidance_scale: 3.5
  upscaler:
    backend: realesrgan
    model_id: RealESRGAN_x4plus
    checkpoint: null
    native_scale: 4
    tile: 0
    tile_pad: 10
    pre_pad: 0

artifacts:
  # from_config() downloads files now; operations only load them into memory.
  prefetch_on_init: true
  cache_dir: null
  weights_dir: ../weights

memory:
  policy: sequential
  track_peak: true
processing:
  max_image_side: 2048
  size_multiple: 16
mask:
  threshold: 127
  dilate: 12
  erode: 0
generation:
  seed: 42
  # Backend-specific defaults are used unless a call overrides these values.
  num_inference_steps: null
  guidance_scale: null
