name: imageinpaint

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12
  - pip>=24.3
  # Keep the compiled image/scientific stack on one Conda channel. Mixing a
  # pip NumPy with Conda SciPy/OpenCV caused the binary-ABI errors seen before.
  - numpy=1.26.4
  - scipy=1.16.3
  - pillow=11.3
  - opencv=4.10
  - pyyaml
  - pytest
  - jupyterlab
  - ipywidgets
  - ipykernel
  - pip:
      # Linux/WSL CUDA 13 wheels are available from PyPI. On native Windows,
      # install this pair from https://download.pytorch.org/whl/cu130 instead.
      - torch==2.14.0
      - torchvision==0.29.0
      # Diffusers 0.37 introduced FLUX.2 Klein; 0.37.1 includes its first
      # compatibility fixes while staying close to OmniPaint's private API.
      - diffusers==0.37.1
      - transformers==4.55.4
      - tokenizers==0.21.4
      - peft==0.17.1
      - accelerate==1.10.1
      - huggingface-hub==0.34.4
      - safetensors==0.6.2
      - sentencepiece==0.2.1
      # 0.48.0 is the first bitsandbytes release with CUDA 13 wheels.
      - bitsandbytes==0.48.0
      - realesrgan==0.3.0
      - basicsr==1.4.2
      - facexlib==0.3.0
      - gfpgan==1.3.8
      - einops==0.8.1
