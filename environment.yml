name: imageinpaint

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - numpy=1.26.4
  - pillow
  - opencv
  - pyyaml
  - pytest
  - jupyterlab
  - ipywidgets
  - ipykernel
  - pip:
      - torch==2.14.0
      - torchvision==0.29.0
      - scipy==1.16.3
      - diffusers==0.35.1
      - bitsandbytes
      - transformers>=4.41,<5
      - accelerate
      - peft
      - safetensors
      - huggingface-hub
      - sentencepiece
      - realesrgan
      - basicsr
      - facexlib
      - gfpgan
      - einops
