[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inpaint-core"
version = "0.1.0"
description = "Extensible all-in-one AI image editing core with pluggable model backends."
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks", "third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
