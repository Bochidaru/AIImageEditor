name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install test/lint dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pillow opencv-python-headless pyyaml pytest ruff fastapi uvicorn httpx
          pip install -e .

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest
